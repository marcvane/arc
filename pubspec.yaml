name: arc

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  image_picker: ^1.2.3
  image_cropper: ^12.2.1

  fl_chart: ^1.2.0

  supabase_flutter: ^2.17.2

  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/arc_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/arc_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/arc_logo.png"